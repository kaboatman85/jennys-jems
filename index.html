<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff9ccf" />
    <title>Jenny's Jems</title>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="app">
      <header>
        <h1>Jenny's Jems</h1>
        <div class="hud">
          <div class="pill">Score <span id="score">0</span></div>
          <div class="pill">Best <span id="best">0</span></div>
        </div>
      </header>
      <main id="stage">
        <canvas id="board" aria-label="Game board"></canvas>
        <div id="toast" aria-live="polite"></div>
      </main>
      <footer>
        <button class="btn" id="new-game" type="button">New Game</button>
        <button class="btn" id="sound" type="button" aria-pressed="true">Sound: On</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
