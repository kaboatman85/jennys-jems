<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e3b65c" />
    <title>Jenny's Jems</title>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="app">
      <header>
        <h1>Jenny's Jems</h1>
        <p class="subtitle"><span class="deco">〜</span> 제니의 보석 <span class="deco">〜</span></p>
      </header>
      <main id="stage">
        <div class="pill" id="pill-score">
          <span class="kr">점수</span>
          <span class="en">Score</span>
          <span class="val" id="score">0</span>
        </div>
        <div class="board-wrap">
          <canvas id="board" aria-label="게임 보드"></canvas>
          <div id="toast" aria-live="polite"></div>
        </div>
        <div class="pill" id="pill-best">
          <span class="kr">최고</span>
          <span class="en">Best</span>
          <span class="val" id="best">0</span>
        </div>
      </main>
      <footer>
        <button class="btn" id="new-game" type="button">새 게임</button>
        <button class="btn sound" id="sound" type="button" aria-pressed="true">소리: On</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
