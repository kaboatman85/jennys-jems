<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e3b65c" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Jenny's Jems</title>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="app">
      <header>
        <h1>Jenny's Jems</h1>
        <p class="subtitle"><span class="deco">〜</span> 제니의 보석 <span class="deco">〜</span></p>
      </header>

      <main id="screen-home" class="screen">
        <p class="home-prompt">게임을 골라요! <span class="en">Pick a game</span></p>
        <div class="home-cards">
          <button class="home-card" id="home-gems-btn" type="button">
            <canvas class="home-icon" id="home-gems-icon" width="360" height="180" aria-hidden="true"></canvas>
            <span class="home-text">
              <span class="home-title">보석 <span class="en">Gems</span></span>
              <span class="home-sub">3개를 맞춰요 <span class="en">Match 3 gems &middot; 100 levels</span></span>
            </span>
          </button>
          <button class="home-card" id="home-blocks-btn" type="button">
            <canvas class="home-icon" id="home-blocks-icon" width="360" height="180" aria-hidden="true"></canvas>
            <span class="home-text">
              <span class="home-title">블록 <span class="en">Blocks</span></span>
              <span class="home-sub">조각을 맞춰요 <span class="en">Fit pieces &middot; collect jewels</span></span>
            </span>
          </button>
        </div>
      </main>

      <main id="screen-levels" class="screen hidden">
        <div class="levels-toolbar">
          <button class="btn menu" id="gems-home-btn" type="button">홈 <span class="en">Home</span></button>
          <button class="btn" id="endless-btn" type="button">엔드리스 <span class="en">Endless</span></button>
        </div>
        <div id="levels-grid" class="levels-grid" role="list"></div>
      </main>

      <main id="screen-game" class="screen hidden">
        <div class="pill" id="pill-score">
          <span class="kr" id="pill-score-kr">점수</span>
          <span class="en" id="pill-score-en">Score</span>
          <span class="val" id="score">0</span>
        </div>
        <div class="board-wrap">
          <div id="objectives-bar" class="hidden"></div>
          <div class="board-frame-wrap">
            <canvas id="board" aria-label="게임 보드"></canvas>
            <img class="frame-corner frame-tl" src="frame-tl.png" alt="" />
            <img class="frame-corner frame-tr" src="frame-tr.png" alt="" />
            <img class="frame-corner frame-bl" src="frame-bl.png" alt="" />
            <img class="frame-corner frame-br" src="frame-br.png" alt="" />
          </div>
          <div id="toast" aria-live="polite"></div>
        </div>
        <div class="pill" id="pill-best">
          <span class="kr" id="pill-best-kr">최고</span>
          <span class="en" id="pill-best-en">Best</span>
          <span class="val" id="best">0</span>
        </div>
      </main>

      <main id="screen-blocks-menu" class="screen hidden">
        <div class="levels-toolbar">
          <button class="btn menu" id="blocks-menu-home-btn" type="button">홈 <span class="en">Home</span></button>
          <button class="btn" id="blocks-menu-endless-btn" type="button">엔드리스 <span class="en">Endless</span></button>
        </div>
        <div id="blocks-levels-grid" class="levels-grid" role="list"></div>
      </main>

      <main id="screen-blocks" class="screen hidden">
        <div class="blocks-hud">
          <div class="pill compact" id="blocks-pill-score">
            <span class="kr" id="blocks-score-kr">점수</span>
            <span class="en" id="blocks-score-en">Score</span>
            <span class="val" id="blocks-score">0</span>
          </div>
          <div class="pill compact" id="blocks-pill-stage">
            <span class="kr" id="blocks-stage-kr">단계</span>
            <span class="en" id="blocks-stage-en">Stage</span>
            <span class="val" id="blocks-stage">1</span>
          </div>
          <div class="pill compact" id="blocks-pill-best">
            <span class="kr" id="blocks-best-kr">최고</span>
            <span class="en" id="blocks-best-en">Best</span>
            <span class="val" id="blocks-best">0</span>
          </div>
        </div>
        <div class="blocks-wrap" id="blocks-wrap">
          <canvas id="blocks-canvas" aria-label="블록 퍼즐 보드"></canvas>
          <div class="blocks-frame" id="blocks-frame" aria-hidden="true">
            <img class="frame-corner frame-tl" src="frame-tl.png" alt="" />
            <img class="frame-corner frame-tr" src="frame-tr.png" alt="" />
            <img class="frame-corner frame-bl" src="frame-bl.png" alt="" />
            <img class="frame-corner frame-br" src="frame-br.png" alt="" />
          </div>
          <div id="blocks-toast" aria-live="polite"></div>
        </div>
      </main>

      <footer id="footer-levels">
        <button class="btn sound" id="sound" type="button" aria-pressed="true">소리: On</button>
      </footer>

      <footer id="footer-game" class="hidden">
        <button class="btn menu" id="back-btn" type="button">목록 <span class="en">Menu</span></button>
        <button class="btn" id="new-game" type="button">새 게임</button>
        <button class="btn sound" id="sound-game" type="button" aria-pressed="true">소리: On</button>
      </footer>
      <footer id="footer-blocks" class="hidden">
        <button class="btn menu" id="blocks-back-btn" type="button">목록 <span class="en">Menu</span></button>
        <button class="btn" id="blocks-new-btn" type="button">새 게임</button>
        <button class="btn sound" id="sound-blocks" type="button" aria-pressed="true">소리: On</button>
      </footer>
    </div>

    <div id="blocks-end-overlay" class="overlay hidden">
      <div class="overlay-card">
        <h2 id="blocks-end-title">게임 오버! Game Over</h2>
        <p id="blocks-end-detail"></p>
        <div class="overlay-actions">
          <button class="btn menu" id="blocks-end-menu-btn" type="button">목록 <span class="en">Menu</span></button>
          <button class="btn sound" id="blocks-end-again-btn" type="button">다시 <span class="en">Again</span></button>
          <button class="btn hidden" id="blocks-end-next-btn" type="button">다음 <span class="en">Next</span></button>
        </div>
      </div>
    </div>

    <div id="level-end-overlay" class="overlay hidden">
      <div class="overlay-card">
        <h2 id="level-end-title">레벨 클리어!</h2>
        <div id="level-end-stars" class="stars" aria-hidden="true"></div>
        <p id="level-end-detail"></p>
        <div class="overlay-actions">
          <button class="btn menu" id="overlay-menu-btn" type="button">목록 <span class="en">Menu</span></button>
          <button class="btn sound" id="overlay-retry-btn" type="button">다시 <span class="en">Retry</span></button>
          <button class="btn" id="overlay-next-btn" type="button">다음 <span class="en">Next</span></button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
